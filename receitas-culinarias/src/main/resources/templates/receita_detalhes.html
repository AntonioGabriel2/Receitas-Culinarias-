<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8">
  <title>Detalhes da Receita</title>
  <link rel="stylesheet" href="/css/receita_detalhes.css">
  <style>
    .muted{color:#666}
    .comments{list-style:none;padding:0;margin:0}
    .comment-item{border:1px solid #eee;border-radius:8px;padding:12px;margin:10px 0}
    .comment-header{display:flex;gap:12px;align-items:center;margin-bottom:6px}
    .comment-header .when{font-size:.9em;color:#666}
    .comment-body{white-space:pre-wrap}
    .comment-actions{margin-top:8px}
    .inline{display:inline}
    .msg.ok{background:#e7f6ec;border:1px solid #7ac08a;padding:8px;border-radius:6px;margin-bottom:12px}
    .msg.err{background:#fdeaea;border:1px solid #e08b8b;padding:8px;border-radius:6px;margin-bottom:12px}
    .btn{padding:8px 12px;border:1px solid #ccc;border-radius:6px;text-decoration:none}
    .btn-secondary{background:#f5f5f5}
  </style>
</head>
<body>
  <div class="container">
    <!-- Mensagens -->
    <div class="msg ok" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="msg err" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <h1 th:text="${receita.nome}">Nome da Receita</h1>

    <div class="section">
      <h2>Ingredientes</h2>
      <p class="ingredientes" th:text="${receita.ingredientes}">-</p>
    </div>

    <div class="section">
      <h2>Modo de Preparo</h2>
      <p class="modo-preparo" th:text="${receita.modoPreparo}">-</p>
    </div>

    <div class="actions" style="margin-bottom: 24px;">
      <a th:href="@{|/receitas/${receita.id}/edit|}" class="btn"
         th:if="${
           #authorization.expression('hasRole(''ADMIN'')')
           or (receita.criadoPor != null and #authentication != null and #authentication.name == receita.criadoPor.email)
         }">Editar</a>
      <a th:href="@{/receitas}" class="btn btn-secondary">Voltar</a>
    </div>

    <!-- ==================== COMENTÁRIOS ==================== -->
    <div class="section" id="comentarios">
      <h2>Comentários</h2>

      <!-- Lista de comentários (controller coloca "comentarios" no model) -->
      <div th:if="${#lists.isEmpty(comentarios)}" class="muted">Ainda não há comentários.</div>

      <ul th:if="${!#lists.isEmpty(comentarios)}" class="comments">
        <li th:each="c : ${comentarios}" class="comment-item">
          <div class="comment-header">
            <strong th:text="${c.autor != null ? c.autor.nome : 'Anônimo'}">Autor</strong>
            <span class="when"
                  th:if="${c.criadoEm != null}"
                  th:text="${#temporals.format(c.criadoEm, 'dd/MM/yyyy HH:mm')}">
              00/00/0000 00:00
            </span>
          </div>

          <!-- Não apagado: mostra o texto normalmente -->
          <div class="comment-body" th:if="${!c.apagado}" th:text="${c.texto}">Texto do comentário…</div>

          <!-- Apagado: ADMIN vê conteúdo e metadados; outros veem placeholder -->
          <div class="comment-body" th:if="${c.apagado}">
            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
              <em>
                [Comentário excluído
                <span th:if="${c.apagadoEm != null}">
                  em <span th:text="${#temporals.format(c.apagadoEm,'dd/MM/yyyy HH:mm')}">-</span>
                </span>
                <span th:if="${c.apagadoPor != null}">
                  por <span th:text="${c.apagadoPor.nome}">admin</span>
                </span>
                <span th:if="${c.motivoExclusao != null}">
                  — <span th:text="${c.motivoExclusao}">motivo</span>
                </span>
                ]
              </em>
              <br>
              <span th:text="${c.texto}">conteúdo original</span>
            </div>
            <div class="muted" th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">
              Comentário excluído pela moderação.
            </div>
          </div>

          <!-- Botão excluir: só ADMIN ou autor, e só se ainda não foi apagado -->
          <div class="comment-actions"
               th:if="${!c.apagado and (
                         #authorization.expression('hasRole(''ADMIN'')')
                         or (#authentication != null and c.autor != null and #authentication.name == c.autor.email)
                       )}">
            <form th:action="@{|/comentarios/${c.id}/delete|}" method="post" class="inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn">Excluir</button>
            </form>
          </div>
        </li>
      </ul>

      <!-- Form para novo comentário (apenas autenticado) -->
      <div class="comment-form" th:if="${#authorization.expression('isAuthenticated()')}">
        <form th:action="@{|/receitas/${receita.id}/comentarios|}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label for="texto">Escreva seu comentário:</label>
          <textarea id="texto" name="texto" rows="3" required minlength="1" maxlength="2000"
                    placeholder="Compartilhe sua opinião ou dica…"></textarea>
          <div style="margin-top:8px;">
            <button type="submit" class="btn">Publicar</button>
          </div>
        </form>
      </div>

      <!-- Sugestão de login quando não autenticado -->
      <p class="muted" th:if="${#authorization.expression('!isAuthenticated()')}">
        <a th:href="@{/login}">Entre</a> para comentar.
      </p>
    </div>
    <!-- ===================================================== -->
  </div>
</body>
</html>
